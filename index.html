            { id: 16, title: "Lab 16: TShoot STP Root", type: "Troubleshooting", difficulty: "Medium", device: "Switch", scenario: "Take back root bridge status from a rogue switch.", tasks: Array.from({length: 10}, (_, i) => ({ id: i+1, instruction: `Complete STP step ${i+1}`, answers: ["enable", "conf t", "spanning-tree vlan 1 priority 4096", "spanning-tree vlan 10,20 root primary", "end", "show spanning-tree vlan 1", "conf t", "interface gi0/1", "spanning-tree guard root", "end"][i], hint: "Force priority.", explanation: "Reclaims Root." })) },
            { id: 17, title: "Lab 17: Secure Device Access (SSH)", type: "Configuration", difficulty: "Medium", device: "Router", scenario: "Enable SSH and disable Telnet on VTY lines.", tasks: Array.from({length: 10}, (_, i) => ({ id: i+1, instruction: `Complete SSH step ${i+1}`, answers: ["enable", "conf t", "ip domain-name secure.corp", "crypto key generate rsa modulus 2048", "username admin privilege 15 secret cisco123!", "ip ssh version 2", "line vty 0 4", "login local", "transport input ssh", "end"][i], hint: "Secure VTY.", explanation: "Enables SSH." })) },
            { id: 18, title: "Lab 18: TShoot IPv6 Routing", type: "Troubleshooting", difficulty: "Hard", device: "Router", scenario: "Fix disabled IPv6 routing and bad static routes.", tasks: Array.from({length: 10}, (_, i) => ({ id: i+1, instruction: `Complete IPv6 step ${i+1}`, answers: ["enable", "conf t", "ipv6 unicast-routing", "no ipv6 route 2001:db8:acad:2::/64 2001:db8:acad:99::2", "ipv6 route 2001:db8:acad:2::/64 2001:db8:acad:1::2", "ipv6 route ::/0 s0/0/0", "end", "show ipv6 route static", "ping 2001:db8:acad:2::1", "show ipv6 interface brief"][i], hint: "Enable unicast-routing.", explanation: "Fixes IPv6." })) },
            { id: 19, title: "Lab 19: TShoot OSPFv3", type: "Troubleshooting", difficulty: "Hard", device: "Router", scenario: "OSPFv3 needs a manual 32-bit Router ID to function.", tasks: Array.from({length: 10}, (_, i) => ({ id: i+1, instruction: `Complete OSPFv3 step ${i+1}`, answers: ["enable", "conf t", "ipv6 unicast-routing", "ipv6 router ospf 10", "router-id 1.1.1.1", "exit", "interface gi0/0", "ipv6 ospf 10 area 0", "end", "show ipv6 ospf neighbor"][i], hint: "Set router-id.", explanation: "Starts OSPFv3." })) },
            { id: 20, title: "Lab 20: Comprehensive Outage", type: "Troubleshooting", difficulty: "Hard", device: "Router", scenario: "Fix a bad default route, OSPF passive interface, and blocking ACL.", tasks: Array.from({length: 10}, (_, i) => ({ id: i+1, instruction: `Complete final TShoot step ${i+1}`, answers: ["enable", "conf t", "router ospf 1", "no passive-interface gi0/0", "exit", "no ip route 0.0.0.0 0.0.0.0 fa0/1", "ip route 0.0.0.0 0.0.0.0 s0/1/0", "no ip access-list extended block_dns", "end", "ping 8.8.8.8"][i], hint: "Fix routing and ACLs.", explanation: "Restores total connectivity." })) }
        ];

        const { useState, useEffect, useRef } = React;
        
        const Icons = {
            Check: () => <svg className="w-5 h-5 text-term-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            Terminal: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
            ShieldAlert: () => <svg className="w-4 h-4 mr-1 text-term-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
            Trophy: () => <svg className="w-10 h-10 text-yellow-500 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        };

        const IOSEngine = {
            getPrompt: (device, mode) => {
                const name = device || 'Router';
                switch(mode) {
                    case 'user': return `${name}>`;
                    case 'priv': return `${name}#`;
                    case 'config': return `${name}(config)#`;
                    case 'config-if': return `${name}(config-if)#`;
                    case 'config-vlan': return `${name}(config-vlan)#`;
                    case 'config-router': return `${name}(config-router)#`;
                    case 'config-line': return `${name}(config-line)#`;
                    default: return `${name}>`;
                }
            },
            
            getHelp: (mode) => {
                const commonHelp = `
  clear      Reset functions
  disable    Turn off privileged commands
  enable     Turn on privileged commands
  exit       Exit from the EXEC
  help       Description of the interactive help system
  ping       Send echo messages
  show       Show running system information`;
                
                const privHelp = commonHelp + `
  configure  Enter configuration mode
  copy       Copy from one file to another
  write      Write running configuration to memory, network, or terminal`;

                const configHelp = `
  do         To run exec commands in config mode
  end        Exit from configure mode
  exit       Exit from configure mode
  hostname   Set system's network name
  interface  Select an interface to configure
  ip         Global IP configuration subcommands
  ipv6       Global IPv6 configuration subcommands
  line       Configure a terminal line
  router     Enable a routing process
  vlan       VLAN commands`;

                switch(mode) {
                    case 'user': return "Exec commands:" + commonHelp;
                    case 'priv': return "Privileged Exec commands:" + privHelp;
                    case 'config': return "Configure commands:" + configHelp;
                    default: return "Commands available:\n  exit  Exit from current mode\n  end   End configuration";
                }
            },

            processCommand: (cmd, currentMode, nextTask) => {
                const lowerCmd = cmd.trim().toLowerCase();
                let nextMode = currentMode;
                let output = '';
                let isTaskMatch = false;

                // 1. Check Task Match FIRST
                if (nextTask && nextTask.answers.includes(lowerCmd)) {
                    isTaskMatch = true;
                    // Provide generic simulated output if it's a show/ping command
                    if (lowerCmd.startsWith('show ') || lowerCmd.startsWith('sh ')) {
                        output = `\n... Simulated output for [${cmd}] ...\n[OK]`;
                    } else if (lowerCmd.startsWith('ping ')) {
                        output = `\nType escape sequence to abort.\nSending 5, 100-byte ICMP Echos, timeout is 2 seconds:\n!!!!!\nSuccess rate is 100 percent (5/5)`;
                    } else if (lowerCmd.includes('shutdown')) {
                        output = `\n%LINK-5-CHANGED: Interface state to ${lowerCmd.includes('no ') ? 'up' : 'down'}`;
                    }
                }

                // 2. Structural/Mode Transitions
                if (lowerCmd === '?' || lowerCmd === 'help') {
                    output = IOSEngine.getHelp(currentMode);
                    return { nextMode, output, isTaskMatch }; // help never completes a task
                }

                if (currentMode === 'user' && (lowerCmd === 'enable' || lowerCmd === 'en')) nextMode = 'priv';
                else if (currentMode === 'priv' && lowerCmd === 'disable') nextMode = 'user';
                else if (currentMode === 'priv' && (lowerCmd === 'configure terminal' || lowerCmd === 'conf t')) nextMode = 'config';
                else if (['config', 'config-if', 'config-vlan', 'config-router', 'config-line'].includes(currentMode) && lowerCmd === 'end') nextMode = 'priv';
                else if (currentMode !== 'user' && currentMode !== 'priv' && currentMode !== 'config' && (lowerCmd === 'exit' || lowerCmd === 'ex')) nextMode = 'config';
                else if (currentMode === 'config' && (lowerCmd === 'exit' || lowerCmd === 'ex')) nextMode = 'priv';
                else if (currentMode === 'priv' && (lowerCmd === 'exit' || lowerCmd === 'ex')) nextMode = 'user';
                
                // Entering sub-config modes
                else if (currentMode === 'config' && (lowerCmd.startsWith('interface ') || lowerCmd.startsWith('int '))) nextMode = 'config-if';
                else if (currentMode === 'config' && lowerCmd.startsWith('vlan ')) nextMode = 'config-vlan';
                else if (currentMode === 'config' && lowerCmd.startsWith('router ')) nextMode = 'config-router';
                else if (currentMode === 'config' && lowerCmd.startsWith('line ')) nextMode = 'config-line';

                // 3. Handle Errors (if no task match and no mode change and not empty)
                if (!isTaskMatch && currentMode === nextMode && output === '' && lowerCmd !== '') {
                    // Just a rudimentary valid command check so we don't spam 'invalid' for correct syntax typed at wrong time
                    const validStarts = ['do ', 'ip ', 'ipv6 ', 'switchport ', 'spanning-tree ', 'crypto ', 'channel-group '];
                    if (!validStarts.some(s => lowerCmd.startsWith(s))) {
                        output = `\n% Invalid input detected at '^' marker.`;
                    }
                }

                return { nextMode, output, isTaskMatch };
            }
        };

        const Terminal = ({ lab, onTaskComplete, getNextTask }) => {
            const [history, setHistory] = useState([{ type: 'system', text: `Connected to ${lab.device} console.\nPress RETURN to get started.` }]);
            const [input, setInput] = useState('');
            const [mode, setMode] = useState('user');
            const endOfTermRef = useRef(null);
            const inputRef = useRef(null);

            // Reset terminal on lab change
            useEffect(() => {
                setHistory([{ type: 'system', text: `\n*** Lab Changed: ${lab.title} ***\nConnected to ${lab.device} console.` }]);
                setMode('user');
                setInput('');
            }, [lab.id]);

            useEffect(() => {
                endOfTermRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [history]);

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const cmd = input;
                    setInput('');
                    
                    const promptStr = IOSEngine.getPrompt(lab.device, mode);
                    const newHistory = [...history, { type: 'input', text: `${promptStr} ${cmd}` }];
                    
                    if (cmd.trim() !== '') {
                        const nextTask = getNextTask();
                        const { nextMode, output, isTaskMatch } = IOSEngine.processCommand(cmd, mode, nextTask);
                        
                        if (isTaskMatch) {
                            onTaskComplete(nextTask.id);
                            newHistory.push({ type: 'system', text: `\n[Task ${nextTask.id} Completed!]` });
                        }
                        
                        if (output) {
                            newHistory.push({ type: 'output', text: output });
                        }
                        setMode(nextMode);
                    }
                    setHistory(newHistory);
                } else if (e.key === '?') {
                    // Immediate Help trigger on '?'
                    e.preventDefault();
                    const promptStr = IOSEngine.getPrompt(lab.device, mode);
                    const output = IOSEngine.getHelp(mode);
                    setHistory([
                        ...history, 
                        { type: 'input', text: `${promptStr} ${input}?` },
                        { type: 'output', text: output }
                    ]);
                }
            };

            const focusTerminal = () => inputRef.current?.focus();

            return (
                <div className="flex-1 bg-term-black font-mono text-sm p-4 text-term-cliText flex flex-col relative" onClick={focusTerminal}>
                    <div className="flex-1 overflow-y-auto cli-scrollbar pb-2 whitespace-pre-wrap">
                        {history.map((line, i) => (
                            <div key={i} className={`mb-1 ${line.type === 'system' ? 'text-gray-400' : line.type === 'output' ? 'text-gray-300' : ''}`}>
                                {line.text}
                            </div>
                        ))}
                        <div className="flex items-center mt-1">
                            <span className="mr-2 select-none">{IOSEngine.getPrompt(lab.device, mode)}</span>
                            <input
                                ref={inputRef}
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={handleKeyDown}
                                className="bg-transparent text-term-cliText outline-none flex-1 font-mono"
                                autoFocus
                                spellCheck="false"
                                autoComplete="off"
                            />
                        </div>
                        <div ref={endOfTermRef} />
                    </div>
                </div>
            );
        };

        const TaskChecklist = ({ tasks, progress, labId }) => {
            return (
                <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                    {tasks.map((task, index) => {
                        const isComplete = progress[`${labId}_${task.id}`];
                        const isNext = !isComplete && (index === 0 || progress[`${labId}_${tasks[index-1].id}`]);
                        
                        return (
                            <div key={task.id} className={`p-4 rounded-lg border transition-all duration-300 ${isComplete ? 'bg-term-green/10 border-term-green/30 opacity-70' : isNext ? 'bg-term-card border-term-blue shadow-[0_0_15px_rgba(59,130,246,0.15)] animate-slide-in' : 'bg-term-panel border-term-border opacity-50'}`}>
                                <div className="flex items-start">
                                    <div className="mt-0.5 mr-3 flex-shrink-0">
                                        {isComplete ? <Icons.Check /> : 
                                         isNext ? <div className="w-5 h-5 rounded-full border-2 border-term-blue flex items-center justify-center"><div className="w-2 h-2 bg-term-blue rounded-full"></div></div> :
                                         <div className="w-5 h-5 rounded-full border-2 border-term-border"></div>}
                                    </div>
                                    <div className="flex-1">
                                        <p className={`text-sm md:text-base font-medium ${isComplete ? 'text-term-green line-through' : isNext ? 'text-white' : 'text-gray-400'}`}>
                                            {task.instruction}
                                        </p>
                                        
                                        {(isNext || isComplete) && (
                                            <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {isNext && (
                                                    <div className="text-xs bg-yellow-900/20 text-yellow-300 p-2 rounded border border-yellow-700/30">
                                                        <span className="font-bold">Hint:</span> {task.hint}
                                                    </div>
                                                )}
                                                {isComplete && (
                                                    <div className="text-xs bg-term-blue/10 text-blue-300 p-2 rounded border border-term-blue/30 col-span-1 md:col-span-2">
                                                        <span className="font-bold">Concept:</span> {task.explanation}<br/>
                                                        <span className="font-mono mt-1 text-term-green">Correct command: {task.answers[0]}</span>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [activeLabId, setActiveLabId] = useState(1);
            const [progress, setProgress] = useState({});

            const activeLab = ALL_LABS.find(l => l.id === activeLabId);
            
            const handleTaskComplete = (taskId) => {
                setProgress(prev => ({ ...prev, [`${activeLabId}_${taskId}`]: true }));
            };

            const getNextTask = () => {
                return activeLab.tasks.find(t => !progress[`${activeLab.id}_${t.id}`]);
            };

            const completedCount = activeLab ? activeLab.tasks.filter(t => progress[`${activeLab.id}_${t.id}`]).length : 0;
            const totalCount = activeLab ? activeLab.tasks.length : 0;
            const isLabComplete = completedCount === totalCount && totalCount > 0;

            return (
                <div className="flex flex-col md:flex-row h-full w-full bg-term-bg">
                    {/* Sidebar */}
                    <div className="w-full md:w-72 lg:w-80 flex-shrink-0 bg-term-panel border-r border-term-border flex flex-col h-1/4 md:h-full z-20">
                        <div className="p-4 md:p-5 border-b border-term-border flex items-center space-x-3 bg-black">
                            <Icons.Terminal />
                            <h1 className="font-bold text-sm md:text-base tracking-wider text-term-green">CCNA UNIFIED CLI</h1>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                            {ALL_LABS.map(lab => {
                                const lCompleted = lab.tasks.filter(t => progress[`${lab.id}_${t.id}`]).length;
                                return (
                                    <button 
                                        key={lab.id} 
                                        onClick={() => setActiveLabId(lab.id)}
                                        className={`w-full text-left p-2.5 rounded-md flex flex-col transition-all duration-200 text-xs md:text-sm ${activeLabId === lab.id ? 'bg-term-card border border-term-border' : 'hover:bg-term-card/50 border border-transparent'}`}
                                    >
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`font-medium pr-2 truncate ${activeLabId === lab.id ? 'text-white' : 'text-gray-400'}`}>{lab.title}</span>
                                            {lCompleted === 10 && <Icons.Check />}
                                        </div>
                                        <div className="flex justify-between items-center text-[10px] md:text-xs">
                                            <span className={lab.type === 'Configuration' ? 'text-term-blue' : 'text-term-orange'}>{lab.type}</span>
                                            <span className="text-term-muted">{lCompleted}/10</span>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    
                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-3/4 md:h-full min-w-0">
                        {activeLab ? (
                            <>
                                {/* Top Half: Scenario & Tasks */}
                                <div className="h-1/2 flex flex-col border-b border-term-border bg-term-bg p-4 md:p-6 min-h-[50%]">
                                    {/* Header & Scenario */}
                                    <div className="mb-4">
                                        <div className="flex items-center justify-between mb-2">
                                            <h2 className="text-xl md:text-2xl font-bold text-white truncate pr-4">{activeLab.title}</h2>
                                            <span className="text-sm font-mono bg-black px-3 py-1 rounded text-term-green border border-term-green/30 flex-shrink-0">
                                                {completedCount} / 10
                                            </span>
                                        </div>
                                        <div className="p-3 bg-term-card border-l-4 border-term-blue rounded shadow-sm text-sm text-gray-300">
                                            <span className="font-bold text-white mr-2">Scenario:</span>{activeLab.scenario}
                                        </div>
                                    </div>
                                    
                                    {/* Task Checklist */}
                                    {isLabComplete ? (
                                        <div className="flex-1 flex flex-col items-center justify-center p-6 bg-term-green/5 border border-term-green/20 rounded-lg">
                                            <Icons.Trophy />
                                            <h3 className="text-xl font-bold text-term-green">Lab Completed Successfully!</h3>
                                            <p className="text-sm text-gray-400 mt-2 text-center max-w-md">You've successfully entered all required commands. Select another lab from the sidebar to continue practicing.</p>
                                        </div>
                                    ) : (
                                        <TaskChecklist tasks={activeLab.tasks} progress={progress} labId={activeLab.id} />
                                    )}
                                </div>
                                
                                {/* Bottom Half: Unified CLI Terminal */}
                                <div className="h-1/2 flex flex-col bg-black">
                                    <div className="bg-[#111] px-4 py-1.5 border-b border-[#333] flex justify-between items-center select-none text-xs text-gray-400 font-mono">
                                        <div className="flex items-center space-x-2">
                                            <div className="flex space-x-1">
                                                <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                                                <div className="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                                                <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
                                            </div>
                                            <span className="ml-4 uppercase tracking-wider">{activeLab.device} Console - ptys0</span>
                                        </div>
                                        <div className="flex items-center text-term-muted">
                                            <Icons.ShieldAlert />
                                            <span>Type ? for Help</span>
                                        </div>
                                    </div>
                                    <Terminal lab={activeLab} onTaskComplete={handleTaskComplete} getNextTask={getNextTask} />
                                </div>
                            </>
                        ) : null}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
